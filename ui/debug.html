<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS 2.0 — debug</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  #medidor { height: 18px; }
  #eventos { font-family: monospace; font-size: 12px; max-height: 320px; overflow-y: auto; }
  .linha { display: flex; gap: 14px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .valor { font-size: 22px; color: var(--ciano); min-width: 90px; }
</style>
</head>
<body>
<header><div class="logo">JARVIS <span>debug</span></div><div class="topo-dir"><a href="/" style="color:var(--ciano)">← HUD</a></div></header>
<main style="grid-template-columns: 1fr 1fr;">
  <section class="painel">
    <h2>Máquina de estados (servidor)</h2>
    <div class="linha"><span class="valor" id="d-estado">—</span><span id="d-clientes">clientes: —</span></div>
    <h2>Nível do microfone (navegador)</h2>
    <div class="barra" id="medidor"><div id="d-mic"></div></div>
    <div class="linha"><button id="d-btnmic">Ativar mic do navegador</button></div>
    <h2>VAD / wake (servidor, monitor de áudio)</h2>
    <div class="linha">VAD: <span class="valor" id="d-vad">—</span> wake: <span class="valor" id="d-wake">—</span> nível: <span class="valor" id="d-nivel">—</span></div>
    <div class="linha"><button id="d-btndebug">Modo diagnóstico (DEBUG)</button></div>
  </section>
  <section class="painel">
    <h2>Últimos 50 eventos do WebSocket</h2>
    <div id="eventos" class="caixa">conectando...</div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let analisador = null, debug = false;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    $("d-estado").textContent = d.estado || "?";
    $("d-vad").textContent = d.vad ?? "?";
    $("d-wake").textContent = d.wake ?? "?";
    $("d-nivel").textContent = d.nivel ?? "?";
  };
  async function eventos() {
    try {
      const r = await fetch("/api/eventos?n=50").then((x) => x.json());
      const c = await fetch("/api/clientes").then((x) => x.json());
      $("d-clientes").textContent = "clientes: " + c.conectados;
      $("eventos").textContent = r.eventos.map((e) => `#${e.id} ${e.tipo} ${JSON.stringify(e.dados)}`).join("\n");
    } catch { /* servidor fora */ }
  }
  setInterval(eventos, 1000); eventos();
  $("d-btnmic").onclick = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      analisador = ctx.createAnalyser(); analisador.fftSize = 512;
      ctx.createMediaStreamSource(stream).connect(analisador);
      const dados = new Uint8Array(analisador.frequencyBinCount);
      setInterval(() => {
        analisador.getByteTimeDomainData(dados);
        let soma = 0;
        for (const v of dados) soma += Math.abs(v - 128);
        $("d-mic").style.width = Math.min(100, (soma / dados.length / 64) * 160) + "%";
      }, 100);
    } catch { $("d-mic").style.width = "0%"; alert("Microfone bloqueado no navegador."); }
  };
  $("d-btndebug").onclick = async (e) => {
    debug = !debug;
    await fetch("/api/debug", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ligado: debug }) });
    e.target.classList.toggle("ativo", debug);
  };
})();
</script>
</body>
</html>
