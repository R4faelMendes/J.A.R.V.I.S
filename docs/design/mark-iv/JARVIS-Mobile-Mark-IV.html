voice==='listening'?'Concluir fala':'Digite um comando',S.voice==='listening'?'voice':'palette','small ghost','keyboard')}<button class="voicekey ${S.voice==='listening'?'active':''}" data-a="voice" title="${S.voice==='listening'?'Concluir comando de voz':'Ativar escuta de demonstração'}" aria-label="${S.voice==='listening'?'Concluir fala':'Ativar microfone'}">${I(S.voice==='listening'?'stop':'mic')}</button>${S.voice==='listening'?B('Cancelar','voice-cancel','small ghost'):tag('CTRL + K')}</div></div></section><aside class="rail"><div class="railhead"><span>TELEMETRIA LOCAL</span><b>PC / 01</b></div><section class="panel"><button class="panelcap" style="width:100%" data-a="system"><span>ESTADO DO SISTEMA</span>${I('arrow')}</button><div class="telemetry">${meter('CPU',S.cpu,'%',S.cpu)}${meter('MEMÓRIA',(S.ram*.08).toFixed(1).replace('.',','),' / 8 GB',S.ram)}${meter('ARMAZENAMENTO','256','GB LIVRES',50)}<div class="telemetryfooter"><span><i class="dot"></i>${S.cpu>80?'ATENÇÃO AO CONSUMO':'OPERAÇÃO NORMAL'}</span><span>128 MB / JARVIS</span></div></div></section><section class="panel"><button class="panelcap" style="width:100%" data-a="agenda"><span>PRÓXIMOS EVENTOS</span>${I('arrow')}</button>${S.tasks.filter(t=>!t.done).slice(0,2).map(t=>`<button class="timelineitem" style="width:100%;text-align:left" data-a="agenda"><span class="time">${t.time}</span><span><b>${esc(t.title)}</b><small>Hoje · ${esc(t.remind)}</small></span></button>`).join('')||'<div class="empty" style="padding:20px">Tudo concluído por hoje.</div>'}</section><section class="panel"><div class="connected"><div class="deviceicon">${I('phone')}</div><span class="appinfo"><b>Celular de Rafael</b><small><i class="dot"></i>${S.paired?'Sincronizado agora':'Não pareado'}</small></span><button data-a="devices" aria-label="Abrir conexões">${I('arrow')}</button></div><div class="quickdevice">${B('Conexões','devices','small ghost')}${B('Parear','pair','small ghost')}</div></section></aside></div>`;}
function subnav(){return `<div class="subnav">${[['apps','Aplicativos'],['files','Arquivos'],['windows','Janelas'],['input','Mouse e teclado']].map(([v,l])=>`<button class="${S.sub===v?'selected':''}" data-a="windows-tab" data-tab="${v}">${l}</button>`).join('')}</div>`;}
function windowsView(){return `${heading('CONTROLE NATIVO / WINDOWS','Seu computador, sob comando.','Aplicativos, arquivos, janelas e dispositivos de entrada.',B('Comando rápido','palette','ghost','keyboard'))}<div class="workspace-scroll">${subnav()}<div class="split wide"><section class="panel">${windowsContent()}</section><aside class="panel"><div class="panelcap">CONTROLES DO SISTEMA ${I('settings')}</div><div class="controlgroup"><div class="eyebrow">ÁUDIO PRINCIPAL</div><div class="row">${I('volume')}<span style="font-size:11px">${esc(S.prefs.output)}</span></div><div class="sliderrow"><input type="range" min="0" max="100" value="${S.volume}" data-range="volume" aria-label="Volume do Windows"><output data-volume-label>${S.volume}%</output></div><div class="row" style="margin-top:15px">${B(S.volume?'Silenciar':'Ativar som','mute','small ghost')}${B('Saída de áudio','audio','small ghost')}</div></div><div class="controlgroup"><div class="eyebrow">ENERGIA E SESSÃO</div><div class="powergrid">${powerButton('lock','Bloquear')}${powerButton('sleep','Suspender')}${powerButton('restart','Reiniciar')}${powerButton('shutdown','Desligar',true)}</div><p class="muted" style="font-size:10px;line-height:1.9;margin:15px 0 0">Uma confirmação sempre antecede os comandos de energia.</p></div><div class="controlgroup"><div class="eyebrow">ÚLTIMA EXECUÇÃO</div><div style="font-size:12px;line-height:1.7">Ambiente de trabalho iniciado</div><div class="muted mono" style="font-size:9px;margin-top:7px">3 APLICATIVOS / 08:00</div><button class="link" data-a="history" style="margin-top:14px">Ver registro ${I('arrow')}</button></div></aside></div></div>`;}
function powerButton(type,label,danger=false){return `<button class="powerbtn ${danger?'danger':''}" data-a="power" data-power="${type}">${I({lock:'lock',sleep:'moon',restart:'restart',shutdown:'power'}[type])}${label}</button>`;}
function windowsContent(){if(S.sub==='apps')return `<div class="panelcap"><span>APLICATIVOS / ${S.apps.length}</span>${tag(S.apps.filter(a=>a.open).length+' EM EXECUÇÃO')}</div><div class="padded" style="padding-bottom:0"><div class="searchfield">${I('search')}<input id="appfilter" placeholder="Buscar aplicativo…" value="${esc(S.filter)}" aria-label="Buscar aplicativo"></div></div><div class="applist" id="app-results">${appRows()}</div><div class="padded row between"><span class="muted" style="font-size:10px">Abertura e encerramento por comando autorizado.</span>${B('Criar rotina','routine-new','small ghost','plus')}</div>`;
if(S.sub==='files')return `<div class="panelcap"><span>EXPLORADOR / BUSCA LOCAL</span>${I('folder')}</div><div class="padded"><div class="searchfield">${I('search')}<input id="filefilter" aria-label="Buscar arquivos" placeholder="Buscar arquivos ou pastas…" value="${esc(S.filefilter)}"></div></div><div id="file-results">${fileRows()}</div><div class="padded"><span class="muted" style="font:9px var(--mono)">4 RESULTADOS DE EXEMPLO / C: — PROJETOS E DOCUMENTOS</span></div>`;
if(S.sub==='windows')return `<div class="panelcap"><span>GERENCIADOR DE JANELAS</span>${tag('2 JANELAS ATIVAS')}</div><div class="padded stack"><div class="windowstage ${S.windowlayout||''}" id="windowstage"><div class="mockwindow" draggable="true"><div class="mocktitle"><span>VISUAL STUDIO CODE</span>— □ ×</div><div class="mockbody">${'<i></i>'.repeat(9)}</div></div><div class="mockwindow second" draggable="true"><div class="mocktitle"><span>EXPLORADOR</span>— □ ×</div><div class="mockbody">${'<i></i>'.repeat(6)}</div></div></div><div class="row" style="flex-wrap:wrap">${B('Lado a lado','arrange','small primary','window')}${B('Área de trabalho','minimize-all','small ghost')}${B('Restaurar','restore-windows','small ghost')}${B('Alternar foco','focus-window','small ghost')}</div><div class="muted" style="font-size:11px">Arraste as janelas da prévia para reposicioná-las.</div></div>`;
return `<div class="panelcap"><span>ENTRADA / TECLADO E MOUSE</span>${I('keyboard')}</div><div class="padded stack"><h2>Atalhos de teclado</h2><div class="row"><span class="keycap">Ctrl</span>+<span class="keycap">Shift</span>+<span class="keycap">Esc</span></div><div class="field"><label for="shortcut">Combinação de teclas</label><input id="shortcut" value="Ctrl + Shift + Esc"></div><div class="row">${B('Executar atalho','shortcut','primary','play')}${B('Sequência de mouse','mouse-sequence','ghost')}</div><div class="line"></div><h2>Área de transferência</h2><div class="field"><label for="clipboardtext">Texto para copiar ou colar</label><textarea id="clipboardtext">Olá, Rafael. Todos os sistemas prontos.</textarea></div><div class="row">${B('Copiar texto','copy-text','small ghost','copy')}${B('Simular colagem','paste-text','small ghost','keyboard')}</div><div class="row between"><span class="muted" style="font-size:10px">Acesso limitado às permissões concedidas.</span><button class="link" data-a="settings-permissions">Revisar permissões ${I('shield')}</button></div></div>`;}
function appRows(){const list=S.apps.map((a,i)=>({...a,i})).filter(a=>a.name.toLowerCase().includes(S.filter.toLowerCase()));return list.map(a=>`<div class="approw"><div class="appglyph">${esc(a.glyph)}</div><div class="appinfo"><b>${a.name}</b><small>${a.desc} · <span class="${a.open?'green':''}">${a.open?'Em execução':'Fechado'}</span></small></div>${B(a.open?'Trazer ao foco':'Abrir','app-open','small ghost','',`data-index="${a.i}"`)}${IB(a.open?'close':'plus',a.open?'app-close':'app-add',a.open?'Fechar '+a.name:'Adicionar '+a.name+' à rotina',`data-index="${a.i}"`)}</div>`).join('')||'<div class="empty">Nenhum aplicativo encontrado.<br>Experimente “Spotify” ou “Chrome”.</div>';}
const files=[['Jarvis.Desktop','C: / Projetos / Jarvis / src','Pasta'],['Documentação Jarvis.pdf','C: / Documentos / Estudos','PDF · 2,4 MB'],['Capturas de interface','C: / Imagens / Jarvis','Pasta'],['JARVIS.sln','C: / Projetos / Jarvis','Solução · C#']];
function fileRows(){const arr=files.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(S.filefilter.toLowerCase()));return arr.map(([n,p,t])=>`<div class="fileentry">${I('folder')}<div class="appinfo"><b>${n}</b><small>${p} · ${t}</small></div>${B('Abrir','file-open','small ghost','',`data-name="${esc(n)}"`)}${IB('folder','file-folder','Abrir local do arquivo',`data-name="${esc(n)}"`)}</div>`).join('')||'<div class="empty">Nenhum arquivo encontrado.<br>Busque por “Jarvis” ou “Documentação”.</div>';}
function graph(kind='cpu',h=170){const high=S.cpu>80,arr=Array.from({length:40},(_,i)=>kind==='ram'?(high?.19:.6)+Math.sin(i*.35)*.06:(high?.2:.65)+Math.sin(i*.8)*.11+Math.cos(i*2)*.07);let points=arr.map((v,i)=>`${(i*650/39).toFixed(1)},${(v*(h-30)).toFixed(1)}`).join(' ');return `<svg class="graph" viewBox="0 0 650 ${h}" preserveAspectRatio="none" role="img" aria-label="Gráfico de ${kind==='cpu'?'CPU':'memória'} nos últimos 60 segundos"><defs><linearGradient id="area${kind}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${kind==='cpu'?'#82e0e6':'#e7ba7b'}" stop-opacity=".18"/><stop offset="1" stop-color="#82e0e6" stop-opacity="0"/></linearGradient></defs>${[.1,.35,.6,.85].map((v,i)=>`<path d="M0 ${v*(h-30)}H650" stroke="#46616f" stroke-width=".5"/><text x="0" y="${v*(h-30)-4}">${100-i*25}%</text>`).join('')}<path d="M0 ${h-30}L${points.split(' ').join('L')}L650 ${h-30}Z" fill="url(#area${kind})"/><polyline points="${points}" fill="none" stroke="${kind==='cpu'?'#82e0e6':'#e7ba7b'}" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="0" y="${h-5}">−60s</text><text x="313" y="${h-5}">−30s</text><text x="625" y="${h-5}">AGORA</text></svg>`;}
function systemView(){return systemBody();}
function systemBody(){return `${heading('TELEMETRIA LOCAL / PC DE RAFAEL',S.cpu>80?'Um processo precisa de atenção.':'Sistemas em equilíbrio.','CPU, memória, armazenamento e processos em uma visão integrada.',B(S.cpu>80?'Normalizar cenário':'Simular consumo alto','simulate-alert','ghost','system'))}<div class="workspace-scroll">${S.cpu>80?`<div class="alertstrip">${I('system')}A memória está em 89%. Google Chrome é o maior consumidor.<button data-a="process-confirm">Revisar processo</button></div>`:''}<div class="statsrow"><div class="stat"><span class="eyebrow">PROCESSADOR</span><strong class="${S.cpu>80?'gold':''}">${S.cpu}<small> %</small></strong><div class="caption">INTEL CORE i3 / 4 NÚCLEOS</div><div class="segbar" style="margin-top:16px"><span style="width:${S.cpu}%"></span></div></div><div class="stat"><span class="eyebrow">MEMÓRIA RAM</span><strong>${(S.ram*.08).toFixed(1).replace('.',',')}<small> / 8 GB</small></strong><div class="caption">${S.ram}% EM USO</div><div class="segbar" style="margin-top:16px"><span style="width:${S.ram}%"></span></div></div><div class="stat"><span class="eyebrow">ARMAZENAMENTO</span><strong>256<small> GB</small></strong><div class="caption">LIVRES DE 512 GB</div><div class="segbar" style="margin-top:16px"><span style="width:50%"></span></div></div></div><div class="split wide"><section class="panel"><div class="panelcap"><span>ATIVIDADE DO PROCESSADOR</span><span>ÚLTIMOS 60 SEGUNDOS</span></div><div class="padded">${graph('cpu')}<div class="row between" style="margin-top:16px"><span class="eyebrow" style="letter-spacing:.7px">MEMÓRIA / ${(S.ram*.08).toFixed(1)} GB</span><span class="mono gold" style="font-size:10px">${S.ram}%</span></div>${graph('ram',110)}</div></section><aside class="panel"><div class="panelcap">PROCESSOS ATIVOS ${tag('5')}</div><div class="processrow muted" style="font-size:9px"><span>PROCESSO</span><span>CPU</span><span>RAM</span><span></span></div>${[['Google Chrome',S.cpu>80?'61%':'8%',S.cpu>80?'4,8 GB':'1,1 GB'],['VS Code','4%','480 MB'],['Spotify','2%','210 MB'],['Jarvis','1%','128 MB'],['Windows','3%','860 MB']].map(([n,c,m])=>`<div class="processrow"><span>${n}</span><span>${c}</span><span>${m}</span>${IB('close','process-confirm','Revisar encerramento de '+n,`data-name="${n}"`)}</div>`).join('')}<div class="padded"><div class="row green" style="font-size:10px">${I('shield')}Monitoramento ativo</div><p class="muted" style="font-size:10px;line-height:1.8">Alertas são enviados ao PC e ao celular pareado.</p>${B('Configurar alertas','settings-performance','small ghost')}</div></aside></div></div>`;}
function routinesView(){const r=S.routines[S.routine]||S.routines[0];return `${heading('AUTOMAÇÃO / SEQUÊNCIAS','Uma intenção. Várias ações.','Edite comandos de voz e acompanhe cada etapa da execução.',B('Criar rotina','routine-new','primary','plus'))}<div class="workspace-scroll"><div class="routinelayout"><aside class="stack"><div class="eyebrow">BIBLIOTECA / ${S.routines.length} ROTINAS</div><div class="routine-list">${S.routines.map((r,i)=>`<button class="routineentry ${S.routine===i?'selected':''}" data-a="routine-select" data-index="${i}">${I('routine')}<span><b>${esc(r.name)}</b><small>${r.apps.length} ações · Comando de voz</small></span></button>`).join('')}</div><div class="panel padded"><div class="eyebrow">SINCRONIZAÇÃO</div><p class="muted" style="font-size:11px;line-height:1.9">Suas rotinas também ficam disponíveis no aplicativo do celular.</p><button class="link" data-a="devices">Gerenciar conexão ${I('arrow')}</button></div></aside><section class="panel"><div class="panelcap"><span>EDITOR DE FLUXO / ${esc(r.name.toUpperCase())}</span>${tag('PRONTA','live')}</div><div class="padded row between"><div><h2>${esc(r.name)}</h2><div class="muted" style="font-size:11px;margin-top:8px">${r.apps.length} ações · Execução sequencial no Windows</div></div><div class="row">${IB('edit','routine-edit','Editar rotina')}${IB('trash','routine-delete','Excluir rotina')}</div></div><div class="nodeeditor" style="margin:0 18px"><div class="editorlabel">FLUXO DE AUTOMAÇÃO / LOCAL</div><div class="triggernode"><small>COMANDO DE ATIVAÇÃO</small><b>“${esc(r.phrase)}”</b></div><div class="nodes">${r.apps.map((n,i)=>`<button class="actionnode" data-a="routine-edit"><span class="stepnum">ETAPA / 0${i+1}</span><b>${esc(n)}</b><small>→ EXECUTAR AÇÃO</small></button>`).join('')}</div></div><div class="routinebar"><span class="muted" style="font:9px var(--mono)">NOTIFICAR AO CONCLUIR <span class="green">●</span></span><span class="spacer"></span>${B('Editar sequência','routine-edit','ghost','edit')}${B('Executar rotina','routine-run','primary','play')}</div></section></div></div>`;}
function agendaView(){return `${heading('PRODUTIVIDADE / LEMBRETES','Seu dia, em perspectiva.','Tarefas e notificações sincronizadas entre computador e celular.',B('Novo lembrete','task-new','primary','plus'))}<div class="workspace-scroll"><div class="agenda"><aside class="stack"><div class="dateplate"><span class="eyebrow">QUINTA-FEIRA</span><div class="day">22</div><div class="month">OUTUBRO / 2026</div><div class="minical">${['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('')}${Array.from({length:31},(_,i)=>`<span class="${i===21?'today':''}">${i+1}</span>`).join('')}</div></div><div class="row between"><span class="muted" style="font-size:11px">Tarefas pendentes</span><b class="cyan mono">${S.tasks.filter(t=>!t.done).length}</b></div><div class="row between"><span class="muted" style="font-size:11px">Concluídas</span><b class="green mono">${S.tasks.filter(t=>t.done).length}</b></div>${tag('SINCRONIZAÇÃO ATIVA','live')}</aside><section class="panel"><div class="panelcap"><span>AGENDA DE HOJE</span><span>${S.tasks.length} ITENS</span></div>${S.tasks.map(t=>taskRow(t)).join('')}<div class="padded"><button class="link" data-a="task-new">${I('plus')}Adicionar algo para lembrar</button></div><div class="padded" style="background:#1c324033;border-top:1px solid var(--line)"><div class="eyebrow">EXPERIMENTE DIZER</div><p class="muted" style="font-size:12px;line-height:1.8">“Jarvis, me lembre de revisar o projeto às duas da tarde.”</p>${B('Criar por voz','task-voice','small ghost','mic')}</div></section></div></div>`;}
function taskRow(t){return `<div class="agendarow ${t.done?'done':''}"><span class="tasktime">${t.time}</span><button class="taskcheck" data-a="task-toggle" data-index="${t.id}" aria-label="${t.done?'Reabrir':'Concluir'} tarefa ${esc(t.title)}">${t.done?I('check'):''}</button><div class="appinfo"><b>${esc(t.title)}</b><small>${t.done?'Concluída':esc(t.remind)}${t.date!=='2026-10-22'?' · '+esc(t.date):''}</small></div>${IB('edit','task-edit','Editar lembrete',`data-index="${t.id}"`)}</div>`;}
function devicesView(){return `${heading('LINK DE DISPOSITIVOS / REDE','Presença além do computador.','Controle remoto, Wake-on-LAN e preferências compartilhadas.',B('Conectar celular','pair','primary','plus'))}<div class="workspace-scroll"><div class="split wide"><section class="panel"><div class="panelcap"><span>TOPOLOGIA PESSOAL</span>${tag(S.online?'LINK ATIVO':'SEM RESPOSTA',S.online?'live':'warn')}</div><div class="devicecanvas">${pcSVG()}<div class="connectionline"></div><div class="phoneart">${I('core')}</div></div><div class="devicedetails"><div class="deviceinfo"><b><i class="dot" style="background:${S.online?'var(--green)':'var(--gold)'}"></i>PC de Rafael</b><small>Windows 11 · Jarvis Desktop<br>${S.online?'Conectado pela rede local':'Desligado ou fora da rede'}</small></div><div class="deviceinfo"><b><i class="dot"></i>Celular de Rafael</b><small>${S.paired?'Dispositivo autorizado':'Aguardando pareamento'}<br>Tarefas, rotinas e preferências</small></div></div><div class="routinebar">${B('Sincronizar agora','sync','ghost','restart')}${B(S.online?'Simular PC offline':'Reconectar','connection-toggle','ghost','wifi')}<span class="spacer"></span><button class="link" data-a="mobile">Abrir celular ${I('arrow')}</button></div></section><aside class="panel"><div class="panelcap">CONTROLE REMOTO ${I('phone')}</div><div class="controlgroup"><div class="row between"><h3>PC de Rafael</h3>${tag(S.online?'ONLINE':'OFFLINE',S.online?'live':'warn')}</div><div class="sliderrow"><span class="muted" style="font-size:11px">CPU / RAM</span><span class="spacer"></span><span class="cyan mono" style="font-size:12px">${S.online?S.cpu+'% · '+S.ram+'%':'— · —'}</span></div><div style="margin-top:18px">${B('Ligar computador','wol','primary','power','style="width:100%"')}</div><button class="link" data-a="wol-settings" style="margin-top:13px">Configurar Wake-on-LAN ${I('settings')}</button></div><div class="controlgroup"><div class="eyebrow">AÇÕES AUTORIZADAS</div><div class="stack" style="gap:9px">${B('Abrir Spotify no PC','remote-spotify','ghost','play')}${B('Executar ambiente','routine-run','ghost','routine')}${B('Desligar computador','remote-shutdown','ghost','power')}${B('Avisar quando conectar','online-notify','ghost','bell')}</div></div><div class="controlgroup"><button class="link" data-a="settings-permissions">Permissões e acesso seguro ${I('shield')}</button></div></aside></div></div>`;}
const settingsTabs=[['voice','Voz e inteligência','mic'],['permissions','Permissões','shield'],['memory','Memória e histórico','folder'],['performance','Desempenho e visual','system'],['notifications','Notificações','bell']];
function settingsView(){return `${heading('PREFERÊNCIAS / CONTROLE PESSOAL','Jarvis, do seu jeito.','Defina como ouvir, responder, lembrar e executar.',B('Salvar preferências','prefs-save','primary','check'))}<div class="workspace-scroll"><div class="settingslayout"><aside class="stack" style="gap:4px">${settingsTabs.map(([k,l,i])=>`<button class="sideitem ${S.settings===k?'active':''}" data-a="settings-tab" data-tab="${k}">${I(i)}${l}</button>`).join('')}<div class="line"></div><button class="sideitem" data-a="devices">${I('devices')}Dispositivos</button><button class="sideitem" data-a="help">${I('help')}Sobre o protótipo</button></aside><section class="settingsbody">${settingsContent()}</section></div></div>`;}
function pref(title,desc,key,locked=false){return `<div class="prefrow"><div class="appinfo"><b>${title}</b><small>${desc}</small></div><button class="toggle ${S.prefs[key]?'on':''}" role="switch" aria-checked="${!!S.prefs[key]}" aria-label="${title}" data-a="toggle" data-key="${key}" ${locked?'disabled':''}></button></div>`;}
function settingsContent(){if(S.settings==='voice')return `<h2>Voz e inteligência</h2><p>Uma conversa natural, com o controle sempre nas suas mãos.</p>${pref('Ativação por “Jarvis”','Ativa a escuta ao reconhecer o comando autorizado.','wake')}${pref('Microfone','Permite comandos por voz no aplicativo.','mic')}${pref('Responder em voz alta','Habilita as respostas por síntese de fala.','tts')}<div class="formgrid" style="margin:22px 0"><div class="field"><label for="voice-select">Voz preferida</label><select id="voice-select" data-pref-select="voice"><option>Português (Brasil) · Voz natural</option><option>Português (Brasil) · Voz suave</option></select></div><div class="field"><label for="ai-select">Inteligência</label><select id="ai-select" data-pref-select="ai"><option>IA online</option><option disabled>Modelo local leve · Expansão futura</option></select></div></div><div class="row">${B('Testar voz','voice-test','primary','volume')}${B('Testar escuta','voice-test-mic','ghost','mic')}</div><div class="line" style="margin-top:25px"></div><div class="row between" style="margin-top:18px"><span class="muted" style="font-size:12px">Seus comandos personalizados ficam nas rotinas.</span><button class="link" data-a="routines">Editar comandos ${I('arrow')}</button></div>`;
if(S.settings==='permissions')return `<h2>Permissões e segurança</h2><p>Escolha o que o Jarvis pode executar localmente e pelo celular.</p>${pref('Controle de aplicativos e arquivos','Executa os comandos que você solicitar.','apps')}${pref('Mouse, teclado e área de transferência','Permite sequências de entrada autorizadas.','input')}${pref('Controle remoto pelo celular','Aceita comandos apenas de dispositivos pareados.','remote')}${pref('Conexão externa segura','Requer configurar um canal seguro no aplicativo real.','external')}${pref('Confirmar ações de energia','Desligar, reiniciar, suspender e bloquear sempre pedem confirmação.','confirm',true)}<div class="alertstrip" style="margin-top:20px">${I('shield')}As autorizações desta demonstração são apenas visuais.</div>`;
if(S.settings==='memory')return `<h2>Memória e preferências</h2><p>Uma memória útil, com escolhas claras sobre os seus dados.</p>${pref('Guardar histórico','Mantenha conversas e comandos disponíveis para consulta.','history')}${pref('Sincronizar preferências','Compartilha configurações com o dispositivo pareado.','sync')}<div class="panel padded" style="margin:24px 0"><div class="eyebrow">ARMAZENAMENTO LOCAL</div><p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:0">${S.routines.length} rotinas · ${S.tasks.length} tarefas · ${S.messages.length} mensagens<br>Preferências desta prévia salvas no navegador.</p></div><div class="row">${B('Revisar histórico','history','ghost','folder')}${B('Limpar conversa','history-clear-confirm','ghost','trash')}</div>`;
if(S.settings==='performance')return `<h2>Desempenho e aparência</h2><p>Profundidade visual com uma opção leve para o uso diário.</p>${pref('Modo leve','Pausa as animações contínuas e reduz os efeitos.','light')}${pref('Animações da interface','Transições curtas, núcleo e sinais de conexão.','motion')}${pref('Iniciar com Windows','Preferência visual para a versão desktop.','startup')}<div class="panel padded" style="margin-top:25px"><div class="eyebrow">META DO PROJETO</div><h3 style="margin:13px 0">Intel Core i3 / 8 GB de RAM</h3><p class="muted" style="font-size:12px;line-height:1.9">O visual usa desenho vetorial, sem vídeo ou modelos 3D pesados. A meta de consumo depende da implementação final dos serviços de voz e IA.</p></div>`;
return `<h2>Notificações</h2><p>Escolha os sinais que acompanham o seu dia.</p>${pref('Notificações do Jarvis','Alertas de sistema, execuções e lembretes.','notifications')}${pref('Som de confirmação','Um sinal discreto ao concluir ações.','sounds')}${pref('Sincronizar com o celular','Mostra os alertas nos dispositivos pareados.','sync')}<div style="margin-top:22px">${B('Enviar notificação de teste','notify-test','primary','bell')}</div>`;}
function researchView(){return `${heading('INTELIGÊNCIA / ESTUDOS','Da pergunta ao entendimento.','Exemplo de pesquisa e síntese no Jarvis.',B('Nova pergunta','palette','ghost','plus'))}<div class="workspace-scroll"><div class="split wide"><section class="panel padded researchresult"><div class="eyebrow cyan">RESPOSTA DE DEMONSTRAÇÃO</div><h3>Como funciona o Wake-on-LAN?</h3><p>O Wake-on-LAN permite acordar um computador compatível por um pacote de rede enviado a um dispositivo previamente configurado.</p><ol><li><strong>Preparação.</strong> Habilitar o recurso na BIOS/UEFI e na placa de rede do Windows, quando compatível.</li><li><strong>Conexão.</strong> O computador deve manter a conexão e a alimentação necessárias para receber o pacote.</li><li><strong>Comando remoto.</strong> O celular envia a solicitação e acompanha a resposta do computador.</li></ol><blockquote>O retorno “pacote enviado” não confirma que o Windows iniciou. O Jarvis precisa receber o sinal do computador para confirmar que ficou online.</blockquote><div class="row" style="flex-wrap:wrap">${B('Copiar resumo','copy-research','ghost','copy')}${B('Criar lembrete','task-new','ghost','task')}${B('Ouvir resposta','voice-test','primary','volume')}</div></section><aside class="panel"><div class="panelcap">PRÓXIMOS PASSOS ${I('spark')}</div><div class="padded stack"><h2>Conectar o conhecimento à ação.</h2><p class="muted" style="font-size:12px;line-height:1.9">Veja as configurações de Wake-on-LAN e os dispositivos disponíveis.</p>${B('Configurar Wake-on-LAN','wol-settings','ghost','settings')}${B('Abrir conexões','devices','ghost','devices')}<span class="muted" style="font:9px var(--mono);line-height:1.9">ESTE CONTEÚDO É UM EXEMPLO FIXO.<br>IA ONLINE NÃO ESTÁ CONECTADA NESTA PRÉVIA.</span></div></aside></div><form class="terminalstrip" data-form="message" style="margin-top:20px">${I('chat')}<input name="message" placeholder="Continue a conversa…" aria-label="Perguntar ao Jarvis"><button type="submit" aria-label="Enviar pergunta">${I('arrow')}</button></form></div>`;}
function historyView(){return `${heading('MEMÓRIA / REGISTRO','Tudo que fizemos até aqui.','Conversas e execuções da sua sessão de demonstração.',B('Nova conversa','new-chat','primary','plus'))}<div class="workspace-scroll"><section class="panel"><div class="panelcap">REGISTRO DA SESSÃO ${tag(S.messages.length+' MENSAGENS')}</div>${S.messages.map((m,i)=>`<div class="fileentry">${I(m.from==='user'?'chat':'core')}<div class="appinfo"><b>${esc(m.text.length>100?m.text.slice(0,100)+'…':m.text)}</b><small>${m.from==='user'?'Rafael':'Jarvis'} · Hoje, 09:${40+Math.floor(i/2)}</small></div>${IB('arrow','core','Abrir conversa')}</div>`).join('')||'<div class="empty">Seu histórico está limpo.<br>Inicie uma conversa para criar novos registros.</div>'}</section></div>`;}
function mobileShell(){const view=S.view==='system'?'mobile-system':S.view;return `<div class="mobile-status"><span>9:41</span><span>▮▮▮ &nbsp; Wi-Fi &nbsp; ▰</span></div><header class="mobile-header"><button class="brand" data-a="core"><span class="brandmark"></span>JARVIS</button><div class="mobile-controls">${IB('bell','notifications','Notificações')}${IB('settings','settings','Configurações')}</div></header><main class="workarea"><div class="view ${S.voice==='listening'?'listening':''}" data-view="mobile-${view}">${mobileContent()}</div></main><nav class="mobile-nav" aria-label="Navegação do celular">${[['core','Núcleo','core'],['chat','Conversa','chat'],['devices','PC','pc'],['routines','Rotinas','routine'],['agenda','Agenda','task']].map(([v,l,i])=>`<button data-a="${v}" class="${S.view===v?'active':''}">${I(i)}${l}</button>`).join('')}</nav><div class="mobile-bottom"></div>`;}
function mobileContent(){if(S.view==='core')return `<div class="mobile-scroll"><div class="row between"><span class="eyebrow">NÚCLEO PESSOAL / MK.IV</span><span class="green mono" style="font-size:9px">● CONECTADO</span></div><div class="mobile-core">${coreSVG()}<div class="corecenter"><span>PERSONAL INTELLIGENCE</span><b>J.A.R.V.I.S</b></div></div><div class="mobile-voice">${wave()}<h2>${S.voice==='listening'?'Estou ouvindo, Rafael.':S.voice==='processing'?'Deixe comigo.':'Sempre com você, Rafael.'}</h2><div class="voice-row">${B('Escrever','chat','small ghost','keyboard')}<button class="voicekey ${S.voice==='listening'?'active':''}" data-a="voice" aria-label="${S.voice==='listening'?'Concluir fala':'Ativar microfone'}">${I(S.voice==='listening'?'stop':'mic')}</button>${B(S.voice==='listening'?'Cancelar':'Comandos',S.voice==='listening'?'voice-cancel':'palette','small ghost')}</div></div><section class="mobile-pc"><div class="row between pairrow"><div><div class="eyebrow">PC DE RAFAEL</div><div class="muted" style="font-size:10px;margin-top:7px">${S.online?'Rede local · Sincronizado agora':'Computador fora da rede'}</div></div>${tag(S.online?'ONLINE':'OFFLINE',S.online?'live':'warn')}</div><div class="pcstats"><div><small>PROCESSADOR</small><b>${S.online?S.cpu+'%':'—'}</b></div><div><small>MEMÓRIA</small><b>${S.online?(S.ram*.08).toFixed(1).replace('.',',')+' / 8 GB':'—'}</b></div></div><div class="mobile-quick">${B(S.online?'Controlar PC':'Ligar computador',S.online?'devices':'wol','small primary','power')}${B('Meu ambiente','routine-run','small ghost','routine')}</div></section><button class="link" data-a="agenda" style="margin-top:18px;font-size:11px">${I('task')}${S.tasks.filter(t=>!t.done).length} tarefas para hoje ${I('arrow')}</button></div>`;
if(S.view==='chat')return `<div class="mobile-conversation"><div class="historybar"><span>CANAL PESSOAL / IA ONLINE</span><button data-a="new-chat">+ NOVA</button></div><div class="commbody">${messages()}</div><form class="miniinput" data-form="message"><input name="message" aria-label="Mensagem para Jarvis" placeholder="Escreva sua mensagem…"><button data-a="voice" type="button" aria-label="Ativar microfone">${I('mic')}</button><button type="submit" aria-label="Enviar mensagem">${I('arrow')}</button></form></div>`;
if(S.view==='devices'||S.view==='system')return `<div class="mobile-scroll"><div class="mobile-headrow"><h1>Seu computador.</h1>${IB('plus','pair','Conectar computador')}</div><section class="panel"><div class="panelcap">PC DE RAFAEL ${tag(S.online?'ONLINE':'OFFLINE',S.online?'live':'warn')}</div><div class="devicecanvas">${pcSVG()}<div class="connectionline"></div><div class="phoneart">${I('core')}</div></div><div class="padded" style="padding-top:0"><div class="row between muted" style="font:10px var(--mono);margin-bottom:18px"><span>CPU <span class="cyan">${S.online?S.cpu+'%':'—'}</span></span><span>RAM <span class="cyan">${S.online?S.ram+'%':'—'}</span></span><span>256 GB LIVRES</span></div><div class="mobile-quick">${B('Ligar com WoL','wol','small primary','power')}${B('Desligar','remote-shutdown','small ghost','power')}${B('Reiniciar','remote-restart','small ghost','restart')}${B('Meu ambiente','routine-run','small ghost','routine')}${B('Abrir Spotify','remote-spotify','small ghost','play')}${B('Avisar ao ligar','online-notify','small ghost','bell')}</div></div></section><div class="row between" style="margin:18px 0">${B('Sincronizar','sync','small ghost','restart')}${B(S.online?'Simular offline':'Reconectar','connection-toggle','small ghost','wifi')}</div><button class="link" data-a="wol-settings" style="font-size:11px">Configurar Wake-on-LAN ${I('settings')}</button><button class="link" data-a="settings-permissions" style="font-size:11px;display:flex;margin-top:10px">Revisar permissões remotas ${I('shield')}</button></div>`;
if(S.view==='routines')return `<div class="mobile-scroll"><div class="mobile-headrow"><h1>Suas rotinas.</h1>${IB('plus','routine-new','Nova rotina')}</div><div class="eyebrow" style="margin-bottom:18px">${S.routines.length} ROTINAS SINCRONIZADAS</div>${S.routines.map((r,i)=>`<section class="mobile-routine"><div class="row between"><span class="eyebrow cyan">ROTINA / 0${i+1}</span>${IB('edit','routine-edit','Editar rotina',`data-index="${i}"`)}</div><h2>${esc(r.name)}</h2><p>“${esc(r.phrase)}”</p><div class="muted" style="font:9px var(--mono)">${r.apps.length} AÇÕES / PC DE RAFAEL</div>${B('Executar no computador','routine-run','primary small','play',`data-index="${i}"`)}</section>`).join('')}</div>`;
if(S.view==='agenda')return `<div class="mobile-scroll"><div class="mobile-headrow"><h1>Hoje, 22 outubro.</h1>${IB('plus','task-new','Novo lembrete')}</div><div class="eyebrow" style="margin-bottom:22px">QUINTA-FEIRA / ${S.tasks.filter(t=>!t.done).length} PENDENTES</div>${S.tasks.map(t=>`<div class="mobile-task">${taskRow(t)}</div>`).join('')}<div style="margin-top:20px">${B('Criar lembrete','task-new','primary','plus','style="width:100%"')}</div><p class="muted" style="font-size:11px;line-height:1.9;margin-top:20px">Lembretes no PC e no celular. Tudo no mesmo ritmo.</p></div>`;
if(S.view==='settings')return `<div class="mobile-scroll"><div class="mobile-headrow">${IB('back','core','Voltar ao núcleo')}<h1>Preferências.</h1></div><div class="subnav" style="width:100%;margin-top:18px">${settingsTabs.map(([k,l])=>`<button data-a="settings-tab" data-tab="${k}" class="${S.settings===k?'selected':''}">${l.split(' ')[0]}</button>`).join('')}</div>${settingsContent()}<div style="margin-top:20px">${B('Salvar preferências','prefs-save','primary','check','style="width:100%"')}</div></div>`;
if(S.view==='research')return `<div class="mobile-scroll"><div class="mobile-headrow">${IB('back','chat','Voltar à conversa')}<h1>Pesquisa.</h1></div><div class="researchresult"><div class="eyebrow cyan">EXEMPLO DE RESPOSTA</div><h3>Como funciona o Wake-on-LAN?</h3><p>Uma solicitação pela rede pode acordar um computador compatível, quando o recurso está configurado e a placa de rede permanece alimentada.</p><ol><li>Configure a BIOS/UEFI e o Windows.</li><li>Mantenha o computador na rede compatível.</li><li>Envie o pacote e aguarde a confirmação do PC.</li></ol><blockquote>“Pacote enviado” e “computador online” são estados diferentes.</blockquote>${B('Copiar resumo','copy-research','ghost','copy','style="width:100%"')}${B('Configurar WoL','wol-settings','primary','settings','style="width:100%;margin-top:10px"')}</div></div>`;
if(S.view==='history')return `<div class="mobile-scroll"><div class="mobile-headrow">${IB('back','chat','Voltar à conversa')}<h1>Histórico.</h1></div>${S.messages.map(m=>`<div class="message" style="margin-bottom:24px"><div class="messagehead">${m.from.toUpperCase()}</div>${esc(m.text)}</div>`).join('')||'<div class="empty">Histórico limpo.</div>'}</div>`;return `<div class="mobile-scroll"><h1>Comandos do Windows</h1><p class="muted" style="line-height:1.9">Use o controle remoto para abrir programas, executar rotinas e acompanhar o computador.</p>${B('Abrir controle remoto','devices','primary','pc')}${B('Conversar com Jarvis','chat','ghost','chat','style="margin-top:14px"')}</div>`;}
function drawer(){return `<aside class="notificationdrawer"><div class="drawerhead"><h2>Notificações</h2>${IB('close','drawer-close','Fechar notificações')}</div><div class="spacer" style="overflow:auto">${S.notifications.map((n,i)=>`<button class="notification" data-a="notification-open" data-index="${i}">${I(n.icon)}<span><b>${esc(n.title)}</b><p>${esc(n.detail)}</p><time>${n.time}</time></span></button>`).join('')||'<div class="empty">Tudo em dia.<br>Nenhuma notificação pendente.</div>'}</div><div class="padded">${B('Marcar todas como lidas','notifications-clear','ghost','check','style="width:100%"')}</div></aside>`;}
function toastHTML(){return `<div class="toast" role="status">${I('check')}<div><b>${esc(S.toast.title)}</b><small>${esc(S.toast.detail)}</small></div><button data-a="toast-close" aria-label="Fechar aviso">×</button></div>`;}
function modalShell(title,body,footer='',wide=false){return `<div class="modalback" data-dismiss="modal"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><span class="eyebrow">${title}</span>${IB('close','modal-close','Fechar diálogo')}</div><div class="modalbody">${body}</div>${footer?`<div class="modalfooter">${footer}</div>`:''}</section></div>`;}
const powerNames={shutdown:['Desligar','desligamento','O computador será desligado. Salve seus documentos e confirme quando estiver pronto.'],restart:['Reiniciar','reinicialização','O Windows será reiniciado. Salve seu trabalho antes de continuar.'],sleep:['Suspender','suspensão','O computador entrará em suspensão e interromperá as ações em andamento.'],lock:['Bloquear','bloqueio','Sua sessão será bloqueada. Você precisará se autenticar novamente no Windows.']};
function modalHTML(){const m=S.modal;
if(m.type==='power'){const [label,noun,desc]=powerNames[m.power];return modalShell('CONFIRMAÇÃO / PC DE RAFAEL',`<div class="confirmart">${I({shutdown:'power',restart:'restart',sleep:'moon',lock:'lock'}[m.power])}</div><h2>${label} o computador?</h2><p>${desc}</p><div class="line"></div><div class="row between" style="font:10px var(--mono);margin-top:18px"><span class="muted">ORIGEM DO COMANDO</span><span class="cyan">${S.mobile?'CELULAR DE RAFAEL':'COMPUTADOR LOCAL'}</span></div><p style="font-size:10px;margin-bottom:0">Demonstração: nenhum comando será enviado ao Windows.</p>`,B('Cancelar','modal-close','ghost')+B('Confirmar '+noun,'power-confirm','danger','power'));}
if(m.type==='execution')return modalShell('EXECUÇÃO / '+(m.remote?'LINK REMOTO':'WINDOWS'),`<div class="row between">${tag(execution>=100?'CONCLUÍDO':'EXECUTANDO',execution>=100?'live':'')}<span class="mono cyan" style="font-size:11px">${execution}%</span></div><h2 style="margin-top:20px">${esc(m.title)}</h2><p>${execution>=100?esc(m.success):'O Jarvis está acompanhando cada etapa da sua solicitação.'}</p><div class="progress"><span style="width:${execution}%"></span></div>${m.steps.map((t,i)=>`<div class="executionstep">${I(execution>=((i+1)/m.steps.length*100)?'check':'clock')}<span>${esc(t)}</span><small>${execution>=((i+1)/m.steps.length*100)?'CONCLUÍDO':'AGUARDANDO'}</small></div>`).join('')}<p class="muted" style="font-size:10px;margin:18px 0 0">Fluxo de demonstração · ações reais não executadas.</p>`,execution>=100?B('Concluído','execution-done','primary','check'):B('Interromper execução','execution-cancel','ghost','stop'));
if(m.type==='routine-form'){const r=m.index!==undefined?S.routines[m.index]:{name:'Nova rotina',phrase:'Jarvis, ativar minha rotina',apps:['Visual Studio Code','Google Chrome','Spotify']};return modalShell(m.index!==undefined?'EDITAR ROTINA':'NOVA ROTINA',`<h2>Defina o seu próximo comando.</h2><p>Escolha um nome, a frase de ativação e a sequência de ações.</p><div class="stack" style="margin-top:20px"><div class="field"><label for="routine-name">Nome da rotina</label><input id="routine-name" value="${esc(r.name)}" maxlength="60"></div><div class="field"><label for="routine-phrase">Quando eu disser…</label><input id="routine-phrase" value="${esc(r.phrase)}" maxlength="100"></div><div class="field"><label for="routine-actions">Ações, em ordem (uma por linha)</label><textarea id="routine-actions" style="min-height:110px">${r.apps.map(esc).join('\n')}</textarea></div><span class="muted" style="font-size:10px;line-height:1.8">Você pode abrir aplicativos, executar atalhos e combinar ações autorizadas. Edição limitada a 6 etapas nesta prévia.</span></div>`,B('Cancelar','modal-close','ghost')+B('Salvar rotina','routine-save','primary','check'));}
if(m.type==='task-form'){const t=m.id?S.tasks.find(t=>t.id===m.id):{title:'',time:'14:00',date:'2026-10-22',remind:'PC e celular'};return modalShell(m.id?'EDITAR LEMBRETE':'NOVO LEMBRETE',`<h2>Eu lembro para você.</h2><div class="stack" style="margin-top:22px"><div class="field"><label for="task-title">O que você quer lembrar?</label><input id="task-title" placeholder="Ex.: Revisar projeto Jarvis" value="${esc(t.title)}" maxlength="120"></div><div class="formgrid"><div class="field"><label for="task-date">Data</label><input type="date" id="task-date" value="${t.date}"></div><div class="field"><label for="task-time">Horário</label><input type="time" id="task-time" value="${t.time==='—'?'14:00':t.time}"></div></div><div class="field"><label for="task-channel">Receber o aviso em</label><select id="task-channel"><option ${t.remind==='PC e celular'?'selected':''}>PC e celular</option><option ${t.remind==='Computador'?'selected':''}>Computador</option><option ${t.remind==='Celular'?'selected':''}>Celular</option></select></div><div class="muted" style="font-size:10px;line-height:1.8">Data e horário fazem parte da demonstração. Nenhuma notificação real é agendada.</div></div>`,(m.id?B('Excluir','task-delete','ghost','trash'):'')+B('Cancelar','modal-close','ghost')+B('Salvar lembrete','task-save','primary','check'));}

const commandList=[['Abrir Spotify no computador','remote-spotify','play'],['Preparar meu ambiente de trabalho','routine-run','routine'],['Como está meu computador?','system','system'],['Criar um lembrete','task-new','task'],['Ligar computador com Wake-on-LAN','wol','power'],['Desligar computador','remote-shutdown','power'],['Pesquisar para estudar','research','spark'],['Conectar celular','pair','phone'],['Permissões e segurança','settings-permissions','shield'],['Preferências de voz','settings','mic']];
function paletteItems(q){let arr=commandList.filter(x=>x[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));return (q?`<button class="paletteitem" data-a="palette-send">${I('chat')}<span>Enviar: “${esc(q)}”</span><kbd>ENTER</kbd></button>`:'')+arr.map(([t,a,i])=>`<button class="paletteitem" data-a="${a}">${I(i)}<span>${t}</span><kbd>↵</kbd></button>`).join('')+(!arr.length&&!q?'<div class="empty">Digite um comando.</div>':'');}
function toast(title,detail=''){S.toast={title,detail};clearTimeout(toastTimer);const old=app.querySelector('.toast');if(old)old.remove();app.insertAdjacentHTML('beforeend',toastHTML());toastTimer=setTimeout(()=>{S.toast=null;app.querySelector('.toast')?.remove()},4500);}
function navigate(v){S.view=v;S.modal=null;S.drawer=false;S.compact=false;S.filter='';S.filefilter='';render();}
function modal(type,extra={}){clearTimeout(voiceTimer);S.modal={type,...extra};S.drawer=false;render();setTimeout(()=>{const el=app.querySelector('#palette-query,#voice-command,#task-title,#routine-name,#pair-input');el?.focus();if(el?.id==='voice-command')el.select()},30);}
function addNotification(title,detail,a='core',icon='bell'){if(S.prefs.notifications)S.notifications.unshift({title,detail,time:'Agora',a,icon});}
function run(title,steps,success,complete=()=>{},remote=false){clearRun();S.modal={type:'execution',title,steps,success,remote};S.drawer=false;execution=0;render();steps.forEach((_,i)=>{runTimers.push(setTimeout(()=>{execution=Math.round((i+1)/steps.length*100);if(i===steps.length-1){complete();addNotification(title,success,remote?'devices':'history','check');}render()},(i+1)*650));});}
function clearRun(){runTimers.forEach(clearTimeout);runTimers=[];}
function requireRemote(){if(!S.prefs.remote){toast('Controle remoto desativado','Ative a permissão nas configurações.');return false;}if(!S.paired){modal('pair');return false;}if(!S.online){modal('offline');return false;}return true;}
function sendMessage(text){const raw=text.trim();if(!raw)return;S.modal=null;S.messages.push({from:'user',text:raw});S.voice='processing';S.view=S.mobile?'chat':'core';render();clearTimeout(taskTimer);taskTimer=setTimeout(()=>{S.voice='idle';const q=raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let reply,action,label;
if(/deslig/.test(q)){reply='Entendido. Vou pedir sua confirmação antes de desligar o computador.';action='remote-shutdown';label='Revisar desligamento';}
else if(/reinici/.test(q)){reply='Posso reiniciar o computador. Primeiro preciso que você confirme a ação.';action='remote-restart';label='Revisar reinicialização';}
else if(/ligue|ligar|acord/.test(q)){reply='O Wake-on-LAN envia a solicitação de ativação. Depois acompanho o sinal de retorno do computador.';action='wol';label='Iniciar Wake-on-LAN';}
else if(/spotify/.test(q)){const a=S.apps.find(a=>a.name==='Spotify');a.open=true;reply='Spotify aberto no PC de Rafael. O aplicativo está pronto para usar. Esta é uma execução de demonstração.';addNotification('Spotify aberto','Comando concluído no PC de Rafael.','windows','play');}
else if(/ambiente|rotina|trabalho/.test(q)){reply='Sua rotina “Ambiente de trabalho” reúne VS Code, Chrome e Spotify. Vamos executar a sequência?';action='routine-run';label='Executar ambiente';}
else if(/lembre|tarefa|agenda/.test(q)){reply='Você tem '+S.tasks.filter(t=>!t.done).length+' tarefas pendentes. Posso criar ou editar um lembrete e escolher onde avisar você.';action='task-new';label='Criar lembrete';}
else if(/computador|cpu|memoria|ram|desempenho/.test(q)){reply=S.online?'O processador está em '+S.cpu+'% e a memória usa '+(S.ram*.08).toFixed(1).replace('.',',')+' GB de 8 GB. Você tem 256 GB livres. '+(S.cpu>80?'Há um processo com consumo elevado.':'Os sistemas estão estáveis.'):'O PC está desconectado. Posso avisar quando ele voltar ou iniciar o Wake-on-LAN.';action=S.online?'system':'online-notify';label=S.online?'Ver telemetria':'Avisar quando conectar';}
else if(/pesquis|estud|explique|como funciona/.test(q)){reply='Preparei uma demonstração de pesquisa com explicação e próximos passos. Nesta prévia, o conteúdo é fixo e a IA online ainda não está conectada.';action='research';label='Abrir pesquisa';}
else if(/arquivo|pasta/.test(q)){reply='Encontrei os arquivos de exemplo do projeto Jarvis. Você pode buscar pelo nome e abrir a pasta correspondente.';action='files-direct';label='Abrir explorador';}
else if(/abr[ae]|abrir/.test(q)){reply='Posso abrir os aplicativos autorizados no computador. Escolha o programa na lista.';action='windows';label='Ver aplicativos';}
else if(/ola|bom dia|boa tarde|oi|jarvis/.test(q)){reply='Às suas ordens, Rafael. Posso conversar, preparar seu ambiente, consultar o PC ou organizar seus lembretes.';}
else{reply='Recebi: “'+raw+'”. Nesta demonstração, experimente pedir para abrir o Spotify, consultar o computador, criar um lembrete ou iniciar sua rotina. A IA real será integrada ao aplicativo.';}
S.messages.push({from:'jarvis',text:reply,...(action?{action,label}:{})});render();},850);}
function bindInputs(){app.querySelectorAll('[data-form="message"]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const inp=form.querySelector('input');sendMessage(inp.value)});const af=document.getElementById('appfilter');if(af)af.oninput=()=>{S.filter=af.value;document.getElementById('app-results').innerHTML=appRows()};const ff=document.getElementById('filefilter');if(ff)ff.oninput=()=>{S.filefilter=ff.value;document.getElementById('file-results').innerHTML=fileRows()};const pq=document.getElementById('palette-query');if(pq){pq.oninput=()=>document.getElementById('palette-results').innerHTML=paletteItems(pq.value);pq.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendMessage(pq.value)}};}app.querySelectorAll('[data-range="volume"]').forEach(r=>r.oninput=()=>{S.volume=+r.value;app.querySelectorAll('[data-volume-label]').forEach(o=>o.textContent=S.volume+'%')});app.querySelectorAll('[data-pref-select]').forEach(sel=>{if(sel.dataset.prefSelect==='voice')sel.value=S.prefs.voice;sel.onchange=()=>{S.prefs[sel.dataset.prefSelect]=sel.value;save();toast('Preferência atualizada',sel.value)}});app.querySelectorAll('.mockwindow').forEach(w=>{let start;w.ondragstart=e=>{start={x:e.clientX,y:e.clientY,left:w.offsetLeft,top:w.offsetTop};e.dataTransfer.setData('text/plain','window')};w.ondragend=e=>{if(start){const p=w.parentElement;w.style.left=Math.min(p.clientWidth-w.offsetWidth,Math.max(0,start.left+e.clientX-start.x))+'px';w.style.top=Math.min(p.clientHeight-w.offsetHeight-30,Math.max(0,start.top+e.clientY-start.y))+'px'}};});app.querySelector('.windowstage')?.addEventListener('dragover',e=>e.preventDefault());}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el){e.preventDefault();handle(el.dataset.a,el);}else if(e.target.matches('[data-dismiss="modal"]')&&S.modal?.type!=='execution'){S.modal=null;S.voice='idle';render();}});
function handle(a,el={dataset:{}}){const d=el.dataset||{};if(modules.some(m=>m[0]===a)||['research','history','chat','windows'].includes(a)){navigate(a);return;}switch(a){
case 'settings':S.settings='voice';navigate('settings');break;
case 'desktop':S.mobile=false;S.view='core';S.modal=null;render();break;
case 'mobile':S.mobile=true;S.view='core';S.modal=null;render();break;
case 'compact':S.compact=!S.compact;render();break;
case 'fullscreen':S.fullscreen=!S.fullscreen;S.compact=false;render();toast(S.fullscreen?'Janela maximizada':'Janela restaurada','Ajuste visual da prévia desktop.');break;
case 'session-close':modal('session');break;
case 'session-resume':S.modal=null;S.compact=false;navigate('core');break;
case 'help':modal('help');break;
case 'palette':modal('palette');break;
case 'palette-send':sendMessage(document.getElementById('palette-query').value);break;
case 'modal-close':if(S.modal?.type==='execution')clearRun();S.modal=null;S.voice='idle';render();break;
case 'toast-close':S.toast=null;app.querySelector('.toast')?.remove();break;
case 'notifications':S.drawer=!S.drawer;S.modal=null;render();break;
case 'drawer-close':S.drawer=false;render();break;
case 'notifications-clear':S.notifications=[];render();toast('Tudo em dia','As notificações foram marcadas como lidas.');break;
case 'notification-open':{const n=S.notifications[+d.index];if(n)navigate(n.a);break;}
case 'voice':if(!S.prefs.mic){toast('Microfone desativado','Ative a preferência em Voz e inteligência.');break;}if(S.voice==='listening'){modal('voice-command');}else{S.voice='listening';S.view='core';S.modal=null;render();voiceTimer=setTimeout(()=>{if(S.voice==='listening')modal('voice-command')},1600);}break;
case 'voice-submit':sendMessage(document.getElementById('voice-command').value);break;
case 'voice-cancel':clearTimeout(voiceTimer);S.voice='idle';S.modal=null;render();break;
case 'voice-test':modal('voice-test');break;
case 'voice-test-mic':modal('voice-command',{text:'Jarvis, como está meu computador?'});break;
case 'new-chat':S.messages=[{from:'jarvis',text:'Novo canal de conversa iniciado. O que vamos fazer, Rafael?'}];navigate(S.mobile?'chat':'core');break;
case 'copy-message':copy(S.messages[+d.index]?.text||'');break;
case 'copy-research':copy('Wake-on-LAN permite acordar um PC compatível e previamente configurado. O pacote enviado precisa ser seguido pela confirmação de que o computador voltou a ficar online.');break;
case 'windows-tab':S.sub=d.tab;render();break;
case 'files-direct':S.sub='files';navigate('windows');break;
case 'app-open':{if(!S.prefs.apps){toast('Permissão desativada','Ative o controle de aplicativos nas configurações.');break;}const x=S.apps[+d.index];run('Abrir '+x.name,['Verificar permissão','Localizar aplicativo','Abrir '+x.name],x.name+' está pronto para usar.',()=>x.open=true);break;}
case 'app-close':{const x=S.apps[+d.index];modal('delete-confirm',{kind:'APLICATIVO',title:'Fechar '+x.name+'?',detail:'Confira se não há trabalho não salvo antes de fechar o aplicativo.',operation:'app-close',index:+d.index});break;}
case 'app-add':S.modal={type:'routine-form'};render();setTimeout(()=>{document.getElementById('routine-actions').value=S.apps[+d.index].name},10);break;
case 'file-open':run('Abrir '+d.name,['Localizar arquivo','Abrir no aplicativo padrão'],d.name+' foi aberto na demonstração.');break;
case 'file-folder':toast('Pasta localizada','A pasta de '+d.name+' foi aberta na prévia.');break;
case 'arrange':S.windowlayout='arranged';render();toast('Janelas lado a lado','A prévia foi reorganizada.');break;
case 'minimize-all':S.windowlayout='minimized';render();toast('Área de trabalho exibida','As janelas estão minimizadas na prévia.');break;
case 'restore-windows':S.windowlayout='';render();break;
case 'focus-window':document.querySelector('.mockwindow')?.style.setProperty('z-index','3');toast('Foco alterado','Visual Studio Code está em primeiro plano.');break;
case 'mute':S.volume=S.volume?0:65;render();toast(S.volume?'Áudio ativado':'Áudio silenciado','Volume: '+S.volume+'%.');break;
case 'audio':modal('audio');break;
case 'audio-save':S.prefs.output=document.getElementById('audio-output').value;S.modal=null;save();render();toast('Saída atualizada',S.prefs.output);break;
case 'shortcut':run('Executar atalho',['Revisar autorização','Enviar '+(document.getElementById('shortcut')?.value||'Ctrl + Shift + Esc')],'Atalho demonstrado no Windows.');break;
case 'mouse-sequence':if(!S.prefs.input){toast('Entrada desativada','Revise a permissão de mouse e teclado.');break;}run('Sequência de entrada',['Selecionar campo de busca','Digitar “Jarvis”','Confirmar entrada'],'Sequência demonstrada com sucesso.');break;
case 'copy-text':copy(document.getElementById('clipboardtext').value);break;
case 'paste-text':toast('Colagem simulada','O texto seria enviado à janela selecionada. Nenhuma entrada real foi executada.');break;
case 'power-menu':modal('power-menu');break;
case 'power':modal('power',{power:d.power});break;
case 'remote-shutdown':if(S.mobile&&!requireRemote())break;modal('power',{power:'shutdown'});break;
case 'remote-restart':if(S.mobile&&!requireRemote())break;modal('power',{power:'restart'});break;
case 'power-confirm':{const power=S.modal.power;const label=powerNames[power][0];run(label+' computador',['Confirmar autorização','Enviar comando ao Windows','Registrar confirmação'],label==='Bloquear'?'Sessão bloqueada na simulação.':label+' solicitado. Ação apenas demonstrada.',()=>{if(['shutdown','sleep','restart'].includes(power))S.online=false;},S.mobile);break;}

case 'execution-cancel':clearRun();S.modal=null;execution=0;render();toast('Execução interrompida','As próximas etapas foram canceladas.');break;
case 'simulate-alert':S.cpu=S.cpu>80?18:87;S.ram=S.cpu>80?89:40;render();if(S.cpu>80){addNotification('Uso de memória elevado','Chrome está usando 4,8 GB. Revise os processos.','system','system');toast('Memória próxima do limite','Cenário de demonstração: 89% em uso.');}break;

case 'process-kill':{const name=S.modal.name;run('Encerrar '+name,['Confirmar escolha do usuário','Solicitar encerramento','Atualizar telemetria'],'O processo foi encerrado na simulação. Consumo normalizado.',()=>{S.cpu=18;S.ram=40;});break;}
case 'routine-select':S.routine=+d.index;render();break;
case 'routine-new':modal('routine-form');break;
case 'routine-edit':if(d.index!==undefined)S.routine=+d.index;modal('routine-form',{index:S.routine});break;
case 'routine-save':{const name=document.getElementById('routine-name').value.trim(),phrase=document.getElementById('routine-phrase').value.trim(),apps=document.getElementById('routine-actions').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6);if(!name||!phrase||!apps.length){toast('Complete os campos','Inclua nome, frase e pelo menos uma ação.');break;}const idx=S.modal.index,r={name,phrase,apps};if(idx!==undefined)S.routines[idx]=r;else{S.routines.push(r);S.routine=S.routines.length-1;}navigate('routines');addNotification('Rotina salva',name+' está disponível para executar.','routines','routine');toast('Rotina salva',name+' · '+apps.length+' ações.');break;}
case 'routine-run':{if(d.index!==undefined)S.routine=+d.index;if(S.mobile&&!requireRemote())break;const r=S.routines[S.routine];run(r.name,r.apps,'Rotina concluída. Seu ambiente está pronto.',()=>{r.apps.forEach(n=>{let x=S.apps.find(a=>a.name===n);if(x)x.open=true})},S.mobile);break;}
case 'routine-delete':modal('delete-confirm',{kind:'ROTINA',title:'Excluir '+S.routines[S.routine].name+'?',detail:'A rotina será removida desta sessão de demonstração.',operation:'routine-delete',index:S.routine});break;
case 'task-new':modal('task-form');break;
case 'task-voice':modal('voice-command',{text:'Jarvis, me lembre de revisar o projeto às 14:00'});break;
case 'task-edit':modal('task-form',{id:+d.index});break;
case 'task-toggle':{let t=S.tasks.find(t=>t.id===+d.index);t.done=!t.done;render();toast(t.done?'Tarefa concluída':'Tarefa reaberta',t.title);break;}
case 'task-save':{const title=document.getElementById('task-title').value.trim(),date=document.getElementById('task-date').value,time=document.getElementById('task-time').value,remind=document.getElementById('task-channel').value;if(!title||!date||!time){toast('Complete o lembrete','Informe um título, a data e o horário.');break;}const id=S.modal.id;if(id)Object.assign(S.tasks.find(t=>t.id===id),{title,date,time,remind});else S.tasks.push({id:Date.now(),title,date,time,remind,done:false});navigate('agenda');addNotification('Lembrete salvo',title+' · '+time,'agenda','task');toast('Lembrete salvo',title+' · '+date+' às '+time+' · '+remind+'.');break;}
case 'task-delete':{const id=S.modal.id;S.tasks=S.tasks.filter(t=>t.id!==id);navigate('agenda');toast('Lembrete excluído','O item foi removido da sessão.');break;}
case 'pair':modal('pair',{code:'482 916'});break;
case 'pair-refresh':modal('pair',{code:'739 285'});break;
case 'pair-confirm':{const value=document.getElementById('pair-input').value.replace(/\D/g,''),expected=(S.modal.code||'482 916').replace(/\D/g,'');if(value!==expected){toast('Código não confere','Digite o código de 6 números mostrado na tela.');break;}run('Conectar celular',['Validar código de pareamento','Autorizar dispositivo','Sincronizar preferências'],'Celular conectado ao PC de Rafael.',()=>{S.paired=true},true);break;}
case 'sync':if(!S.paired){modal('pair');break;}run('Sincronizar dispositivos',['Conferir conexão','Sincronizar '+S.routines.length+' rotinas','Atualizar '+S.tasks.length+' lembretes'],'Preferências, tarefas e rotinas sincronizadas.',()=>{},true);break;
case 'connection-toggle':S.online=!S.online;render();toast(S.online?'Conexão restabelecida':'Computador offline',S.online?'O Jarvis recebeu o sinal do PC.':'Cenário de desconexão ativado.');break;
case 'wol-settings':modal('wol-settings');break;
case 'wol-save':{const mac=document.getElementById('wol-mac').value;if(!/^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(mac)){toast('Endereço MAC inválido','Use o formato A4-B1-C2-D3-E4-F5.');break;}S.modal=null;render();toast('Wake-on-LAN configurado','Parâmetros de demonstração salvos.');break;}
case 'wol':if(!S.paired){modal('pair');break;}run('Ligar PC de Rafael',['Preparar pacote Wake-on-LAN','Pacote enviado · aguardando o PC','Sinal recebido · computador online'],'Computador online. Confirmação de retorno recebida.',()=>{S.online=true;},true);break;
case 'remote-spotify':if(!requireRemote())break;run('Abrir Spotify no PC',['Validar dispositivo autorizado','Enviar comando ao Windows','Receber confirmação do aplicativo'],'Spotify aberto no PC de Rafael.',()=>{S.apps.find(a=>a.name==='Spotify').open=true},true);break;
case 'online-notify':S.modal=null;render();addNotification('Alerta de conexão ativado','Avisarei quando o computador ficar online.','devices','bell');toast('Alerta ativado','O protótipo registrou seu pedido de aviso ao conectar.');break;
case 'settings-tab':S.settings=d.tab;S.view='settings';render();break;
case 'settings-permissions':S.settings='permissions';navigate('settings');break;
case 'settings-performance':S.settings='performance';navigate('settings');break;
case 'toggle':S.prefs[d.key]=!S.prefs[d.key];save();render();break;
case 'prefs-save':save();toast('Preferências salvas','O perfil visual foi atualizado nesta prévia.');break;
case 'notify-test':addNotification('Notificação de teste','Jarvis está pronto para avisar você.','settings','bell');toast('Notificação recebida','Teste de alerta concluído no protótipo.');break;
case 'history-clear-confirm':modal('delete-confirm',{kind:'HISTÓRICO',title:'Limpar a conversa?',detail:'As mensagens desta sessão visual serão removidas. Suas rotinas e tarefas continuam disponíveis.',operation:'history-clear'});break;
case 'delete-confirmed':{const m=S.modal;if(m.operation==='history-clear')S.messages=[];if(m.operation==='routine-delete'){S.routines.splice(m.index,1);if(!S.routines.length)S.routines.push({name:'Minha rotina',phrase:'Jarvis, executar minha rotina',apps:['Visual Studio Code']});S.routine=0;}if(m.operation==='app-close')S.apps[m.index].open=false;S.modal=null;render();toast('Alteração concluída','A demonstração foi atualizada.');break;}
default:toast('Comando recebido','O Jarvis registrou a ação solicitada.');}}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Texto copiado','A resposta está disponível na área de transferência.')}catch{S.memory.push(text);toast('Cópia guardada na sessão','O navegador não permitiu acessar a área de transferência.')}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modal('palette')}if(e.key==='Escape'){clearTimeout(voiceTimer);if(S.modal?.type==='execution')clearRun();S.modal=null;S.drawer=false;S.voice='idle';render();}});
// The prototype contains no OS control, network, microphone capture, or live AI calls.
S.prefs.apps=S.prefs.apps??true;render();
window.JarvisPreview={navigate,handle,state:S,render,modal};
</script></body></html>
